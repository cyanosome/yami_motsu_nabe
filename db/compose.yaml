services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: postgres
    restart: always
    ports:
      - "5432:5432" # ホストからの開発用アクセスを許可
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - gateway

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379" # ホストからの開発アクセス許可
    environment:
      TZ: ${TZ}
    volumes:
      - redis_data:/data
    networks:
      - gateway

volumes:
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data

networks:
  gateway:
    external: true
